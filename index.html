<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAFIYORK STREAM - Radio Online & Contenido Digital</title>
    <meta name="description" content="Radio Online, Streaming, Podcast y Producción Audiovisual con máxima potencia desde Tafí Viejo, Tucumán.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <style>
        /* --- IDENTIDAD DE MARCA: TAFIYORK STREAM (Cyberpunk Radio Dark) --- */
        :root {
            --bg-pure: #070708;
            --bg-card: #111114;
            --bg-input: #18181c;
            --neon-yellow: #e6c300;     /* Amarillo Radioactivo - Identidad Tafí York */
            --neon-cyan: #00f3ff;       /* Cyan Eléctrico de Transmisión */
            --live-red: #ff0044;
            --text-main: #ffffff;
            --text-muted: #8a8a93;
            --font-poppins: 'Poppins', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-poppins);
            background-color: var(--bg-pure);
            color: var(--text-main);
            overflow-x: hidden;
        }

        a { text-decoration: none; color: inherit; transition: all 0.3s ease; }
        ul { list-style: none; }

        /* --- CABECERA PERSONALIZADA --- */
        header {
            background-color: rgba(7, 7, 8, 0.9);
            backdrop-filter: blur(10px);
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(230, 195, 0, 0.2);
        }

        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-text {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--text-main);
        }
        .logo-text span {
            color: var(--neon-yellow);
            text-shadow: 0 0 10px rgba(230, 195, 0, 0.4);
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }
        .nav-links a:hover { 
            color: var(--neon-yellow); 
        }

        .social-mini {
            display: flex;
            gap: 15px;
            font-size: 1.1rem;
        }
        .social-mini a { color: var(--text-muted); }
        .social-mini a:hover { 
            color: var(--neon-cyan); 
            transform: translateY(-2px); 
        }

        /* --- HERO PROPIO (Sección Inicio) --- */
        .hero {
            min-height: 100vh;
            background: radial-gradient(circle at center, rgba(24, 24, 28, 0.2) 0%, var(--bg-pure) 80%), 
                        url('https://images.unsplash.com/photo-1615247001958-f4bc92fa6a4a?q=80&w=1920') no-repeat center center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 20px 80px 20px;
            position: relative;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 800px;
        }

        .hero-content h1 {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 15px;
            line-height: 1.1;
        }
        .hero-content h1 .yellow { color: var(--neon-yellow); text-shadow: 0 0 20px rgba(230, 195, 0, 0.3); }
        .hero-content h1 .cyan { color: var(--neon-cyan); text-shadow: 0 0 20px rgba(0, 243, 255, 0.3); }

        .hero-content h2 {
            font-size: 1.3rem;
            color: var(--text-main);
            font-weight: 400;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .hero-content p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 35px;
            font-weight: 300;
        }

        .hero-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-custom {
            padding: 14px 35px;
            font-weight: 600;
            border-radius: 6px;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .btn-yellow {
            background-color: var(--neon-yellow);
            color: #000;
            box-shadow: 0 4px 15px rgba(230, 195, 0, 0.3);
        }
        .btn-yellow:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 25px rgba(230, 195, 0, 0.5); 
        }

        .btn-border {
            background-color: transparent;
            color: var(--text-main);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        .btn-border:hover { 
            border-color: var(--neon-cyan); 
            color: var(--neon-cyan);
            transform: translateY(-2px); 
        }

        /* --- SECCIONES REESTILIZADAS --- */
        section {
            padding: 100px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 2.2rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 60px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .section-title span { color: var(--neon-yellow); }

        /* --- INTERFAZ DE TRANSMISIÓN (En Vivo) --- */
        .live-container {
            display: grid;
            grid-template-columns: 1.7fr 1fr;
            gap: 35px;
            background-color: var(--bg-card);
            border-radius: 8px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .player-container {
            background-color: #000;
            aspect-ratio: 16/9;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(0, 243, 255, 0.2);
            position: relative;
        }
        .player-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .live-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .live-badge {
            background-color: var(--live-red);
            color: white;
            padding: 6px 14px;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 4px;
            width: fit-content;
            margin-bottom: 20px;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            animation: pulse 2s infinite;
        }

        .live-info h3 { font-size: 2rem; margin-bottom: 12px; font-weight: 700; }
        .live-info p { color: var(--text-muted); margin-bottom: 20px; line-height: 1.6; }

        /* ESTILO INTERNO DEL REPRODUCTOR DE AUDIO HTML5 */
        .audio-player-box {
            background: #18181c;
            border: 1px solid var(--neon-yellow);
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 25px;
            text-align: center;
        }
        .audio-player-box p {
            font-size: 0.85rem;
            color: var(--neon-yellow);
            margin-bottom: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .audio-player-box audio {
            width: 100%;
            outline: none;
        }
